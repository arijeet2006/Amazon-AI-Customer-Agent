<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Support Triage Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #1a1f2e 100%);
            min-height: 100vh;
            color: #f3f4f6;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff9900, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 40px; }
        .input-section {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            background: #1a1f2e;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 16px;
            color: #f3f4f6;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 16px;
        }
        textarea:focus { outline: none; border-color: #ff9900; }
        .preset-buttons { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        button.preset {
            background: #1f2937;
            border: 1px solid #374151;
            color: #f3f4f6;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button.preset:hover { background: #374151; border-color: #ff9900; }
        button.analyze {
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #ff6b00);
            border: none;
            color: #0b0f19;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button.analyze:hover { opacity: 0.9; }
        button.analyze:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-section {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
            display: none;
            margin-top: 24px;
        }
        .result-section.visible { display: block; }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1f2937;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #9ca3af; font-size: 0.9rem; }
        .result-value { font-weight: 600; }
        .badge { padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
        .badge-auto {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .badge-escalate {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .reply-card {
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            font-style: italic;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 16px;
            color: #f87171;
            margin-top: 16px;
            display: none;
        }
        .error.visible { display: block; }
        .loading { text-align: center; padding: 20px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Amazon Support Triage Agent</h1>
        <p class="subtitle">Classical ML + Gemini 2.5 Flash</p>

        <div class="input-section">
            <div class="preset-buttons">
                <button class="preset" onclick="setPreset('Where is my package? It was supposed to be delivered yesterday.')">📍 Missing Package</button>
                <button class="preset" onclick="setPreset('I ordered a blue sweater and you guys sent me a coffee mug instead???')">⚠️ Wrong Item</button>
            </div>
            <textarea id="customerMessage" placeholder="Type or select a customer query above..."></textarea>
            <button class="analyze" id="analyzeBtn" onclick="analyze()">Analyze & Draft Response</button>
            <div class="error" id="error"></div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-row">
                <span class="result-label">TRIAGE ACTION</span>
                <span class="result-value"><span class="badge" id="decisionBadge"></span></span>
            </div>
            <div class="result-row">
                <span class="result-label">ROUTED BY</span>
                <span class="result-value" id="handler"></span>
            </div>
            <div class="result-row">
                <span class="result-label">INTENT</span>
                <span class="result-value" id="intent"></span>
            </div>
            <div class="result-row">
                <span class="result-label">CONFIDENCE</span>
                <span class="result-value" id="confidence"></span>
            </div>
            <div class="reply-card" id="replyCard"></div>
        </div>
    </div>

    <script>
        function setPreset(text) {
            document.getElementById('customerMessage').value = text;
        }

        async function analyze() {
            const message = document.getElementById('customerMessage').value.trim();
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resultSection = document.getElementById('resultSection');
            const errorDiv = document.getElementById('error');

            if (!message) {
                showError('Please enter a customer message.');
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Processing...';
            resultSection.classList.remove('visible');
            errorDiv.classList.remove('visible');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                displayResult(data);
            } catch (err) {
                showError(err.message || 'Analysis failed. Please try again.');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = 'Analyze & Draft Response';
            }
        }

        function displayResult(data) {
            const resultSection = document.getElementById('resultSection');
            const errorDiv = document.getElementById('error');

            document.getElementById('decisionBadge').textContent = data.decision;
            document.getElementById('decisionBadge').className = 'badge ' + 
                (data.decision.includes('ESCALATE') ? 'badge-escalate' : 'badge-auto');
            document.getElementById('handler').textContent = data.handler || 'Unknown';
            document.getElementById('intent').textContent = data.intent || 'Unknown';
            document.getElementById('confidence').textContent = (data.confidence * 100).toFixed(1) + '%';
            document.getElementById('replyCard').textContent = data.reply || 'Please DM us your order ID. ^AMZ';

            errorDiv.classList.remove('visible');
            resultSection.classList.add('visible');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('visible');
        }
    </script>
</body>
</html>
